services:
  app:
    environment:
      VIDEO_IMPORT_DIR: /video-imports
      VIDEO_IMPORT_QB_URL: http://qbittorrent:8080
      VIDEO_IMPORT_QB_USERNAME: admin
      VIDEO_IMPORT_QB_PASSWORD: ${VIDEO_IMPORT_QB_PASSWORD:?Set VIDEO_IMPORT_QB_PASSWORD in .env}
    volumes:
      - ${QB_IMPORT_DIR:?Set QB_IMPORT_DIR in .env}:/video-imports

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent@sha256:3d4c4545d51a690a0df15a2ff99038823a88a9822df8e794526447b9afbd7384
    restart: unless-stopped
    ports: ["127.0.0.1:18885:8080"]
    environment:
      PUID: "10001"
      PGID: "10001"
      WEBUI_PORT: "8080"
    volumes:
      - qb_config:/config
      - qb_manual:/downloads
      - ${QB_IMPORT_DIR:?Set QB_IMPORT_DIR in .env}:/video-imports
    networks: [web]

volumes:
  qb_config:
  qb_manual:
