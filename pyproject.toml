[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
  "ignore:The 'app' shortcut is now deprecated:DeprecationWarning",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/__init__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["static/dist", "frontend", "tmp", "data"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "SIM"]
ignore = ["B008", "SIM105"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
